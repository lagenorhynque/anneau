name: Publish API Documentation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read Flix version from flix.toml
        id: flix
        run: echo "version=$(.github/scripts/flix-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Download Flix
        run: |
          curl -fsSL -o flix.jar \
            "https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar"

      # `flix doc` documents everything it compiles and has no flag to narrow
      # that, so the types and instances defined by the tests would be published
      # as part of the API — `SegmentCodec[ToDoId]` and the like. Set the tests
      # aside for the run rather than deleting them.
      - name: Generate the documentation
        run: |
          mv test "$RUNNER_TEMP/test"
          java -jar flix.jar doc

      - name: Assemble the site
        run: |
          .github/scripts/prepare-docs.py \
            --workspace "${{ github.workspace }}" \
            --repository "${{ github.repository }}" \
            --sha "${{ github.sha }}"

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
